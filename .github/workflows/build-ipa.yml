name: Build unsigned IPA

on:
  push:
    branches: [main, "codex/**", "claude/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          if [ -d /Applications/Xcode_16.4.app/Contents/Developer ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: command -v xcodegen >/dev/null || brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Select iPhone simulator
        run: |
          xcrun simctl list devices available --json > "$RUNNER_TEMP/simulators.json"
          python3 - "$RUNNER_TEMP/simulators.json" "$GITHUB_ENV" "$(xcrun --sdk iphonesimulator --show-sdk-version)" <<'PY'
          import json
          import re
          import sys

          def version(value):
              parts = tuple(map(int, re.findall(r"\d+", value)))
              return (parts + (0, 0, 0))[:3]

          sdk_version = version(sys.argv[3])
          with open(sys.argv[1]) as source:
              runtimes = json.load(source)["devices"]
          candidates = [
              (version(runtime), device)
              for runtime, devices in runtimes.items()
              if ".iOS-" in runtime
              if (18, 0, 0) <= version(runtime) <= sdk_version
              for device in devices
              if device.get("isAvailable") and device["name"].startswith("iPhone")
          ]
          if not candidates:
              raise SystemExit("No available iPhone simulator for the selected Xcode")
          _, device = max(candidates, key=lambda entry: (entry[0], entry[1]["state"] == "Booted"))
          with open(sys.argv[2], "a") as environment:
              environment.write(f"SIMULATOR_ID={device['udid']}\n")
              environment.write(f"SIMULATOR_STATE={device['state']}\n")
          print(f"Selected {device['name']} ({device['udid']})")
          PY

      - name: Run unit tests
        run: |
          if [ "$SIMULATOR_STATE" != Booted ]; then
            xcrun simctl boot "$SIMULATOR_ID"
          fi
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          mkdir -p test-results
          xcodebuild test \
            -project SuperTeclado.xcodeproj \
            -scheme SuperTeclado \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath build-tests \
            -resultBundlePath test-results/SuperTeclado.xcresult \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Build unsigned IPA
        run: bash scripts/build-unsigned-ipa.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Super-Teclado-unsigned
          path: |
            Super-Teclado-unsigned.ipa
            Super-Teclado-unsigned.ipa.sha256
            Super-Teclado-build-info.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish IPA as a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python3 -c 'import json; print(json.load(open("Super-Teclado-build-info.json"))["version"])')
          BUILD_NUMBER=$(python3 -c 'import json; print(json.load(open("Super-Teclado-build-info.json"))["build"])')
          TAG="v${VERSION}-build${BUILD_NUMBER}"
          gh release create "$TAG" \
            Super-Teclado-unsigned.ipa \
            Super-Teclado-unsigned.ipa.sha256 \
            Super-Teclado-build-info.json \
            --target "${{ github.sha }}" \
            --title "Super Teclado ${VERSION} (compilación ${BUILD_NUMBER})" \
            --notes "IPA sin firma Apple generada desde ${GITHUB_REF_NAME} (${GITHUB_SHA::7}). Fírmala con KravaSigner, Feather o similar antes de instalarla. Incluye SHA-256 y metadatos del código compilado." \
            --latest

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Super-Teclado-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
