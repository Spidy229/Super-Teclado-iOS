name: Build unsigned IPA

on:
  push:
    branches: [main, "codex/**", "claude/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer || true
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Compile unit tests
        run: |
          xcodebuild build-for-testing \
            -project SuperTeclado.xcodeproj \
            -scheme SuperTeclado \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Build unsigned IPA
        run: bash scripts/build-unsigned-ipa.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Super-Teclado-unsigned
          path: Super-Teclado-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Publish IPA as a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -m1 'MARKETING_VERSION:' project.yml | sed -E 's/.*"([^"]+)".*/\1/')
          TAG="v${VERSION}-build${{ github.run_number }}"
          gh release create "$TAG" Super-Teclado-unsigned.ipa \
            --target "${{ github.sha }}" \
            --title "Super Teclado ${VERSION} (compilación ${{ github.run_number }})" \
            --notes "IPA sin firmar generada desde ${GITHUB_REF_NAME} (${GITHUB_SHA::7}). Fírmala con KravaSign, Feather o similar antes de instalarla." \
            --latest
