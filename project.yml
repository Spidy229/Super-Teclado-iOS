name: SuperTeclado

options:
  bundleIdPrefix: com.spidy229.superteclado
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual

targets:
  SuperTeclado:
    type: application
    platform: iOS
    sources:
      - path: SuperTecladoApp
        # Assets.xcassets se queda en las fuentes: XcodeGen lo pone en «Resources» y así se
        # compila el icono (la clave «resources:» no existe en XcodeGen y se ignoraba).
        excludes:
          - Package.swift
          - Info.plist
          - SuperTeclado.entitlements
      - path: Shared
      - path: SharedIntents
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spidy229.superteclado
        PRODUCT_NAME: SuperTeclado
        MARKETING_VERSION: "2.8.3"
        CURRENT_PROJECT_VERSION: "24"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Super Teclado
        INFOPLIST_KEY_NSFaceIDUsageDescription: Usamos Face ID para proteger tu historial privado del portapapeles.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        CODE_SIGN_ENTITLEMENTS: SuperTecladoApp/SuperTeclado.entitlements
    dependencies:
      - target: SuperTecladoKeyboard
        embed: true
      - target: SuperTecladoShare
        embed: true
      - target: SuperTecladoWidget
        embed: true

  SuperTecladoKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: SuperTecladoKeyboard
        excludes:
          - Info.plist
          - SuperTecladoKeyboard.entitlements
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spidy229.superteclado.keyboard
        PRODUCT_NAME: SuperTecladoKeyboard
        MARKETING_VERSION: "2.8.3"
        CURRENT_PROJECT_VERSION: "24"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: SuperTecladoKeyboard/Info.plist
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        CODE_SIGN_ENTITLEMENTS: SuperTecladoKeyboard/SuperTecladoKeyboard.entitlements

  SuperTecladoShare:
    type: app-extension
    platform: iOS
    sources:
      - path: SuperTecladoShare
        excludes:
          - Info.plist
          - SuperTecladoShare.entitlements
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spidy229.superteclado.share
        PRODUCT_NAME: SuperTecladoShare
        MARKETING_VERSION: "2.8.3"
        CURRENT_PROJECT_VERSION: "24"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: SuperTecladoShare/Info.plist
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        CODE_SIGN_ENTITLEMENTS: SuperTecladoShare/SuperTecladoShare.entitlements

  SuperTecladoWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: SuperTecladoWidget
        excludes:
          - Info.plist
          - SuperTecladoWidget.entitlements
      - path: SharedIntents
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spidy229.superteclado.widget
        PRODUCT_NAME: SuperTecladoWidget
        MARKETING_VERSION: "2.8.3"
        CURRENT_PROJECT_VERSION: "24"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: SuperTecladoWidget/Info.plist
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        CODE_SIGN_ENTITLEMENTS: SuperTecladoWidget/SuperTecladoWidget.entitlements

  SuperTecladoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SuperTecladoTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spidy229.superteclado.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
    dependencies:
      - target: SuperTeclado

schemes:
  SuperTeclado:
    build:
      targets:
        SuperTeclado: all
    run:
      config: Debug
    archive:
      config: Release
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - SuperTecladoTests

